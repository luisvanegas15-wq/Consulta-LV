let tInact;
/* Se guarda la hora del último uso: así se cierra aunque el celular haya estado bloqueado o la app en segundo plano */
let ULT_MEM = 0, ULT_ESC = 0;
function marcarActividad(){ ULT_MEM = Date.now(); try { localStorage.setItem('clv_ult', String(ULT_MEM)); } catch (e) {} }
function ultimaActividad(){ let t = 0; try { t = +localStorage.getItem('clv_ult') || 0; } catch (e) {} return Math.max(t, ULT_MEM); }
function inactivoDemasiado(){ const t = ultimaActividad(); return !t || Date.now() - t > INACTIVIDAD_MIN * 60000; }
function reiniciarInactividad(){ if (!S.prof || inactivoDemasiado()) return; const n = Date.now(); if (n - ULT_ESC < 5000) return; ULT_ESC = n; marcarActividad(); }
function revisarInactividad(){ if (S.prof && inactivoDemasiado()) salir('Sesión cerrada por inactividad 🔒'); }
['click','keydown','touchstart','scroll'].forEach(e => document.addEventListener(e, reiniciarInactividad, { passive: true, capture: true }));
setInterval(revisarInactividad, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') revisarInactividad(); });
window.addEventListener('pageshow', revisarInactividad); window.addEventListener('focus', revisarInactividad);

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DCORTO = ['dom','lun','mar','mié','jue','vie','sáb'];
const A = { fecha: hoyYMD(), modo: innerWidth >= 900 ? 'semana' : 'dia', mes: hoyYMD().slice(0, 7), citas: [], disp: [], abierto: innerWidth >= 900, scrollHecho: false };
const H0 = 6, H1 = 22, PX = 56;
const COLOR = { pendiente: ['#fef3c7','#d97706'], confirmada: ['#dbeafe','#2563eb'], asistio: ['#d1fae5','#059669'], no_asistio: ['#fee2e2','#dc2626'] };
function bog(iso){ const d = new Date(new Date(iso).getTime() - 5 * 3600000); return { ymd: d.toISOString().slice(0, 10), min: d.getUTCHours() * 60 + d.getUTCMinutes() }; }
function dow(ymd){ return new Date(ymd + 'T12:00:00Z').getUTCDay(); }
function lunes(ymd){ return sumarDias(ymd, -((dow(ymd) + 6) % 7)); }
function diasVista(){ if (A.modo === 'dia') return [A.fecha]; const l = lunes(A.fecha); return [0,1,2,3,4,5,6].map(i => sumarDias(l, i)); }
function hhmm(min){ return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0'); }
function etiquetaHora(h){ return h === 12 ? '12 m.' : (h > 12 ? h - 12 : h) + (h < 12 ? ' a. m.' : ' p. m.'); }

      dias.forEach(d => franjasDia(d).forEach(f => mins.push(f[0])));

function htmlMes(){
  const [y, m] = A.mes.split('-').map(Number), ini = lunes(A.mes + '-01'), hoy = hoyYMD(), sel = new Set(diasVista());

function htmlGrid(){
  const dias = diasVista(), H = (H1 - H0) * PX, hoy = hoyYMD(), ahora = bog(new Date().toISOString()), n = dias.length;
  const cols = `46px repeat(${n}, minmax(${n > 1 ? 88 : 0}px, 1fr))`;
  let cab = `<div class="cg-cab" style="grid-template-columns:${cols}"><div></div>${dias.map(d => { const dt = new Date(d + 'T12:00:00Z');
    return `<button class="cg-dia ${d === hoy ? 'hoy' : ''}" onclick="A.modo='dia';irFecha('${d}')"><span>${DCORTO[dt.getUTCDay()]}</span><b>${dt.getUTCDate()}</b></button>`; }).join('')}</div>`;
  let horas = ''; for (let h = H0; h < H1; h++) horas += `<div class="cg-h" style="top:${(h - H0) * PX}px">${etiquetaHora(h)}</div>`;
  let cuerpo = `<div class="cg" style="grid-template-columns:${cols};height:${H}px"><div class="cg-horas">${horas}</div>`;
  dias.forEach(d => {
    let x = '';
    franjasDia(d).forEach(f => {
      const a = Math.max(H0 * 60, f[0]), b = Math.min(H1 * 60, f[1]);
      if (b > a) x += `<div class="cg-disp" style="top:${(a - H0 * 60) / 60 * PX}px;height:${(b - a) / 60 * PX}px"></div>`;
    });
    (A.bloq || []).forEach(bl => {
      const i0 = new Date(d + 'T00:00:00-05:00').getTime(), i1 = i0 + 86400000, s0 = Math.max(i0, new Date(bl.inicio).getTime()), s1 = Math.min(i1, new Date(bl.fin).getTime());
      if (s1 <= s0) return;
      const a = Math.max(H0 * 60, (s0 - i0) / 60000), b2 = Math.min(H1 * 60, (s1 - i0) / 60000);
      if (b2 > a) x += `<div class="cg-bloq" style="top:${(a - H0 * 60) / 60 * PX}px;height:${(b2 - a) / 60 * PX}px" onclick="event.stopPropagation();detalleBloqueo('${bl.id}')"><span>🚫 No disponible${bl.motivo ? ' · ' + esc(bl.motivo) : ''}</span></div>`;

    A.citas.filter(c => c.estado !== 'cancelada' && bog(c.inicio).ymd === d).forEach(c => {

    });

    cuerpo += `<div class="cg-col" onclick="clicHueco(event,'${d}')">${x}</div>`;
  });
  return cab + `<div class="cg-wrap" id="cg-wrap">${cuerpo}</div></div>`;
}

function clicHueco(ev, d){

function recortarFoto(file){
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const lado = Math.min(img.width, img.height), T = 600, c = document.createElement('canvas');
      c.width = T; c.height = T;
      c.getContext('2d').drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, T, T);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : mal(new Error('No se pudo procesar la imagen')), 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('Archivo de imagen no válido')); };
    img.src = url;
  });
}

/* =========================================================
   CIFRADO DE HISTORIA CLÍNICA (solo el psicólogo tiene la clave)
   ========================================================= */
const C = { dk: null, llaves: null };
const TE = new TextEncoder(), TD = new TextDecoder();
const ITER = 310000;
function b64(buf){ const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s); }
function unb64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
function azar(n){ return crypto.getRandomValues(new Uint8Array(n)); }
async function derivar(pass, sal){
  const base = await crypto.subtle.importKey('raw', TE.encode(pass.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: sal, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['wrapKey', 'unwrapKey']);
}
async function envolver(dk, pass){
  const sal = azar(16), iv = azar(12), k = await derivar(pass, sal);
  const w = await crypto.subtle.wrapKey('raw', dk, k, { name: 'AES-GCM', iv });
  return { sal: b64(sal), llave: b64(w), iv: b64(iv) };
}
async function desenvolver(llave, iv, sal, pass){
  const k = await derivar(pass, unb64(sal));
  return crypto.subtle.unwrapKey('raw', unb64(llave), k, { name: 'AES-GCM', iv: unb64(iv) }, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
}
function codigoRecuperacion(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = azar(24); let c = '';
  for (let i = 0; i < 24; i++) c += A[b[i] % 32];
  return c.match(/.{4}/g).join('-');
}
function normCodigo(c){ return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '').match(/.{1,4}/g)?.join('-') || ''; }
async function cifrar(obj){
  const iv = azar(12), ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, C.dk, TE.encode(JSON.stringify(obj)));
  return { contenido_cifrado: b64(ct), iv: b64(iv) };
}
async function descifrar(ct, iv){
  try { return JSON.parse(TD.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, C.dk, unb64(ct)))); }
  catch (e) { return null; }
}
function claveValida(p){ return p.length >= 10 && /[0-9]/.test(p) && /[a-zA-Z]/.test(p); }

    const a = await envolver(dk, p1), r = await envolver(dk, cod.replace(/-/g, ''));

async function recuperarLlave(){
  const cod = normCodigo($('r-cod').value).replace(/-/g, ''), p1 = $('r-p1').value;
  if (!claveValida(p1)) { toast('Mínimo 10 caracteres, con letras y números', true); return; }
  if (p1 !== $('r-p2').value) { toast('Las claves no coinciden', true); return; }
  const b = $('r-btn'); b.disabled = true;
  try {
    const l = C.llaves, k = await derivar(cod, unb64(l.sal_recuperacion));
    const dkx = await crypto.subtle.unwrapKey('raw', unb64(l.llave_por_recuperacion), k, { name: 'AES-GCM', iv: unb64(l.iv_recuperacion) }, { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
    const a = await envolver(dkx, p1);
    const { error } = await sb.from('llaves').update({ sal: a.sal, llave_por_clave: a.llave, iv_clave: a.iv }).eq('profesional_id', S.prof.id);
    if (error) throw error;
    Object.assign(C.llaves, { sal: a.sal, llave_por_clave: a.llave, iv_clave: a.iv });
    C.dk = await desenvolver(a.llave, a.iv, a.sal, p1);
    toast('Clave actualizada ✅'); vistaPacientes();
  } catch (e) { b.disabled = false; toast('Código de recuperación incorrecto', true); }
}

async function guardarHistoria(id, borrador){
  const hc = {}; HC.forEach(([k, t, fs]) => fs.forEach(f => { const v = $('hc-' + f[0]).value.trim(); if (v) hc[f[0]] = v; }));
  const d = { tipo: 'historia', hc, riesgo: $('nt-riesgo').value, acciones_riesgo: $('nt-acc').value.trim(), borrador: !!borrador };
  if (!Object.keys(hc).length) { toast('Escribe al menos un campo', true); return; }
  if (!borrador) {
    const falta = [['motivo', 'el motivo de consulta'], ['dx', 'la impresión diagnóstica'], ['objetivos', 'los objetivos terapéuticos']].find(f => !hc[f[0]]);
    if (falta) { toast(`Falta ${falta[1]}. Complétalo o guarda como borrador`, true); return; }
  }
  if ((d.riesgo === 'alto' || d.riesgo === 'medio') && !d.acciones_riesgo) { toast('Registra las acciones realizadas frente al riesgo', true); return; }
  $('hc-btn').disabled = true;
  const fila = Object.assign({ paciente_id: P.actual.id, fecha: $('hc-fecha').value || hoyYMD() }, NF.citaId ? { cita_id: NF.citaId } : {}, await cifrar(d));
  const r = id ? await sb.from('notas_clinicas').update(fila).eq('id', id) : await sb.from('notas_clinicas').insert(fila);
  if (r.error) { $('hc-btn').disabled = false; toast(mensajeError(r.error), true); return; }
  NF.citaId = null; cerrarModal(); toast(borrador ? 'Borrador guardado 🔒' : 'Historia clínica guardada 🔒'); P.tab = 'historia'; abrirFicha(P.actual.id);
}
async function terminarConsulta(citaId){
  const c = A.citas.find(x => x.id === citaId); if (!c) return;
  if (c.estado !== 'asistio') { const { error } = await sb.from('citas').update({ estado: 'asistio' }).eq('id', citaId); if (error) { toast(mensajeError(error), true); return; } c.estado = 'asistio'; }
  cerrarModal();
  if (!C.dk) { toast('Asistencia registrada. Desbloquea tus historias para escribir la nota'); }
  await abrirFicha(c.paciente_id);
  if (!P.actual || P.actual.id !== c.paciente_id) return;
  const f = bog(c.inicio).ymd, h = historiaActual();
  if (!h) { P.tab = 'historia'; pintarFicha(); formHistoria(null, { citaId, fecha: f }); }
  else { P.tab = 'notas'; pintarFicha(); formNota(null, { citaId, fecha: f }); }
}

/* --- LLAVES PARA QUE EL PACIENTE ENVÍE RESPUESTAS CIFRADAS --- */
const ECDH = { name: 'ECDH', namedCurve: 'P-256' };
async function llavePrivada(){
  if (C.priv) return C.priv;
  if (!C.dk) return null;
  const p = S.prof;
  if (p.clave_publica && p.clave_privada_cifrada) {
    const d = await descifrar(p.clave_privada_cifrada, p.clave_privada_iv); if (!d || !d.pk) return null;
    C.priv = await crypto.subtle.importKey('pkcs8', unb64(d.pk), ECDH, false, ['deriveKey']);
    return C.priv;
  }
  const kp = await crypto.subtle.generateKey(ECDH, true, ['deriveKey']);
  const pub = await crypto.subtle.exportKey('jwk', kp.publicKey), pk = b64(await crypto.subtle.exportKey('pkcs8', kp.privateKey));
  const x = await cifrar({ pk });
  const { data, error } = await sb.from('profesionales').update({ clave_publica: { kty: pub.kty, crv: pub.crv, x: pub.x, y: pub.y }, clave_privada_cifrada: x.contenido_cifrado, clave_privada_iv: x.iv }).eq('id', p.id).select().single();
  if (error) { toast(/column|schema cache/i.test(error.message || '') ? 'Falta ejecutar la actualización v10 de la base de datos' : mensajeError(error), true); return null; }
  S.prof = data; C.priv = kp.privateKey; return C.priv;
}
async function cifrarParaProfesional(jwk, obj){
  const pub = await crypto.subtle.importKey('jwk', Object.assign({ ext: true }, jwk), ECDH, false, []);
  const eph = await crypto.subtle.generateKey(ECDH, true, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'ECDH', public: pub }, eph.privateKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
  const iv = azar(12), ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, TE.encode(JSON.stringify(obj)));
  const e = await crypto.subtle.exportKey('jwk', eph.publicKey);
  return { p_cifrado: b64(ct), p_epk: { kty: e.kty, crv: e.crv, x: e.x, y: e.y }, p_iv: b64(iv) };
}
async function descifrarDelPaciente(f){
  const priv = await llavePrivada(); if (!priv) return null;
  try {
    const epk = await crypto.subtle.importKey('jwk', Object.assign({ ext: true }, f.epk), ECDH, false, []);
    const k = await crypto.subtle.deriveKey({ name: 'ECDH', public: epk }, priv, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return JSON.parse(TD.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(f.iv) }, k, unb64(f.respuesta_cifrada))));
  } catch (e) { return null; }
}

function fechaCal(iso){ return new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
function enlaceGoogleCal(t, ini, fin, det, lugar){
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(t) + '&dates=' + fechaCal(ini) + '/' + fechaCal(fin)

function icsTexto(t){ return String(t || '').replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1').replace(/\r?\n/g, '\\n'); }
function descargarIcs(t, ini, fin, det, lugar){
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//LV Studio//Consulta LV//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',

    'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  a.download = 'cita.ics'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);

const suma = (a, k) => a.reduce((s, x) => s + (x[k || 'valor'] || 0), 0);

/* --- ARCHIVOS ADJUNTOS CIFRADOS --- */
const MAX_ADJ = 9.5 * 1024 * 1024;
function tamano(n){ return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function iconoArchivo(t){ return /^image\//.test(t) ? '🖼️' : /pdf/.test(t) ? '📕' : /word|document/.test(t) ? '📘' : /sheet|excel|csv/.test(t) ? '📗' : /audio/.test(t) ? '🎧' : '📎'; }
async function tabArchivos(){
  const c = $('ficha-c');
  c.innerHTML = `<div class="card"><button class="btn full" onclick="$('adj-file').click()">📎 Adjuntar archivo</button>
    <input type="file" id="adj-file" style="display:none" onchange="subirAdjunto(this)">
    <p class="mini">Consentimientos firmados, pruebas, informes, remisiones o fotos (máx. 9 MB). 🔒 Se cifran en tu dispositivo antes de subir: nadie más puede abrirlos.</p></div><div id="adj-l"><div class="carga" style="padding:20px">Cargando…</div></div>`;
  const { data, error } = await sb.from('adjuntos').select('*').eq('paciente_id', P.actual.id).order('created_at', { ascending: false });
  const box = $('adj-l'); if (!box) return;
  if (error) { box.innerHTML = `<div class="aviso err">${esc(mensajeError(error))}</div>`; return; }
  P.adjuntos = await Promise.all((data || []).map(async a => Object.assign(a, { m: await descifrar(a.meta_cifrada, a.iv_meta) })));
  box.innerHTML = P.adjuntos.length ? P.adjuntos.map(a => a.m ? `<div class="card tap" style="cursor:pointer" onclick="abrirAdjunto('${a.id}')"><div class="row"><span style="font-size:26px">${iconoArchivo(a.m.tipo)}</span>
    <div class="grow" style="min-width:0"><b style="word-break:break-all">${esc(a.m.nombre)}</b><div class="sub">${esc(tamano(a.m.tam))} · ${esc(fecha(a.created_at, { day: 'numeric', month: 'short', year: 'numeric' }))}</div></div><span class="sub">Abrir ›</span></div></div>`
    : `<div class="card"><div class="aviso err">No se pudo descifrar este archivo.</div></div>`).join('') : `<div class="empty">Sin archivos adjuntos.</div>`;
}
async function subirAdjunto(inp){
  const f = inp.files && inp.files[0]; inp.value = '';
  if (!f) return;
  if (f.size > MAX_ADJ) { toast('El archivo supera 9 MB', true); return; }
  if (!C.dk) { toast('Desbloquea tus historias primero', true); return; }
  toast('Cifrando y subiendo… 🔒');
  try {
    const iv = azar(12), ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, C.dk, await f.arrayBuffer());
    const ruta = `${S.prof.id}/${P.actual.id}/${uuid()}.bin`;
    const up = await sb.storage.from('adjuntos').upload(ruta, new Blob([ct], { type: 'application/octet-stream' }), { contentType: 'application/octet-stream', upsert: false });
    if (up.error) throw up.error;
    const meta = await cifrar({ nombre: f.name.slice(0, 150), tipo: f.type || 'application/octet-stream', tam: f.size });
    const { error } = await sb.from('adjuntos').insert({ paciente_id: P.actual.id, ruta, iv: b64(iv), meta_cifrada: meta.contenido_cifrado, iv_meta: meta.iv });
    if (error) throw error;
    toast('Archivo guardado 🔒'); tabArchivos();
  } catch (e) { toast(mensajeError(e), true); }
}
async function abrirAdjunto(id){
  const a = (P.adjuntos || []).find(x => x.id === id); if (!a || !a.m) return;
  toast('Descifrando…');
  try {
    const { data, error } = await sb.storage.from('adjuntos').download(a.ruta);
    if (error) throw error;
    const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(a.iv) }, C.dk, await data.arrayBuffer());
    sb.rpc('registrar_acceso', { p_tabla: 'adjuntos', p_id: a.id });
    const url = URL.createObjectURL(new Blob([plano], { type: a.m.tipo }));
    abrirModal(`<h3 style="word-break:break-all">${iconoArchivo(a.m.tipo)} ${esc(a.m.nombre)}</h3>
      ${/^image\/(jpeg|png|webp|gif)$/.test(a.m.tipo) ? `<img src="${url}" alt="" style="width:100%;border-radius:12px;margin:8px 0">` : `<p class="mini">${esc(tamano(a.m.tam))}. Descárgalo para abrirlo.</p>`}
      <a class="btn full" href="${url}" download="${esc(a.m.nombre)}">⬇️ Descargar</a>
      <p class="mini">Este archivo contiene información clínica reservada. No lo compartas por medios no seguros.</p>
      <button class="btn full ghost" onclick="cerrarModal()">Cerrar</button>`);
    setTimeout(() => URL.revokeObjectURL(url), 300000);
  } catch (e) { toast(/OperationError/.test(String(e && e.name)) ? 'No se pudo descifrar el archivo' : mensajeError(e), true); }
}

  ${sv.length > 1 ? `<label>Servicio</label><select id="le-serv"><option value="">Cualquiera</option>${sv.map(s => `<option value="${esc(s.id)}" ${R.serv && R.serv.id === s.id ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('')}</select>` : ''}
  <label>Nombre completo</label><input id="le-nom" maxlength="120" autocomplete="name">
  <div class="fila"><div><label>Celular (WhatsApp)</label><input id="le-tel" maxlength="15" inputmode="tel" autocomplete="tel"></div><div><label>Correo (opcional)</label><input id="le-email" type="email" maxlength="120"></div></div>
  <label>¿Qué días u horas te sirven?</label><input id="le-pref" maxlength="300" placeholder="Ej: lunes o miércoles después de las 5 p. m.">
  <label class="check"><input type="checkbox" id="le-aut"><span>Autorizo el uso de mis datos para que me contacten sobre un espacio disponible. <a href="#" onclick="verLegal('datos');return false">Leer</a></span></label>
  <button class="btn full" id="le-btn" onclick="enviarEspera()">Anotarme</button><button class="btn full ghost" onclick="cerrarModal()">Cancelar</button>`);
}
async function enviarEspera(){
  if (!$('le-aut').checked) { toast('Debes aceptar la autorización de datos', true); return; }
  const b = $('le-btn'); b.disabled = true;
  const servicio = $('le-serv') ? $('le-serv').value : ((R.perfil.servicios || [])[0] || {}).id;
  const { error } = await sb.rpc('unirse_espera', { p_slug: SLUG, p_servicio: servicio || null, p_nombres: $('le-nom').value, p_telefono: $('le-tel').value,
    p_email: $('le-email').value, p_preferencia: $('le-pref').value, p_acepta_datos: true });
  if (error) { b.disabled = false; toast(mensajeError(error), true); return; }
  cerrarModal(); toast('¡Listo! Quedaste en la lista de espera ✅');
}
function htmlPagoPublico(p){
  const enl = /^https:\/\/[^\s"'<>]+$/i.test(p.enlace_pago || '') ? p.enlace_pago : '';
  if (!p.nequi && !p.datos_pago && !enl) return '';
  return `<div class="card"><h3>💳 Cómo pagar</h3>
    ${p.nequi ? `<div class="franja"><span>📱 Nequi: <b>${esc(p.nequi)}</b></span><button class="btn sm ghost" onclick="copiar('${esc(soloDigitos(p.nequi))}')">Copiar</button></div>` : ''}
    ${p.datos_pago ? `<p style="font-size:14px;white-space:pre-wrap;margin:6px 0">${esc(p.datos_pago)}</p>` : ''}
    ${enl ? `<a class="btn full" target="_blank" rel="noopener" href="${esc(enl)}">Pagar en línea (tarjeta, PSE)</a>` : ''}</div>`;
}
function htmlResenasPublicas(p){
  const l = p.resenas || [];
  if (!l.length) return '';
  return `<div class="card"><div class="row"><h3 class="grow" style="margin:0">⭐ Opiniones verificadas</h3><b style="font-size:18px">${esc(p.promedio)}</b><span style="color:#f59e0b;margin-left:4px">★</span></div>
    <p class="mini" style="margin-top:2px">${p.n_resenas} reseña${p.n_resenas > 1 ? 's' : ''} de pacientes que asistieron a una cita.</p>
    ${l.map((r, i) => `<div class="resena" ${i >= 3 ? 'style="display:none" data-mas' : ''}><div class="row"><b class="grow">${esc(r.a)}</b><span style="color:#f59e0b;font-size:13px">${estrellas(r.e)}</span></div>
      <div class="sub">${esc(fecha(r.f, { month: 'long', year: 'numeric' }))}</div>${r.c ? `<p>${esc(r.c)}</p>` : ''}${r.rp ? `<div class="resp"><b>Respuesta del profesional:</b> ${esc(r.rp)}</div>` : ''}</div>`).join('')}
    ${l.length > 3 ? `<button class="btn sm ghost" onclick="document.querySelectorAll('[data-mas]').forEach(e=>e.style.display='');this.remove()">Ver todas (${l.length})</button>` : ''}</div>`;
}

/* ===== INICIO ===== */
(async function iniciar(){
  if (RTOKEN) { paginaResena(); return; }
  if (FTOKEN) { paginaFormulario(); return; }
  if (CTOKEN) { paginaCita(); return; }
  if (ES_DIR) { paginaDirectorio(); return; }
  if (SLUG) { paginaPublica(); return; }
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') pantallaNuevaClave(); });
  if (/type=recovery/.test(location.hash)) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session && inactivoDemasiado()) { await sb.auth.signOut(); pantallaAcceso('entrar'); toast('Por seguridad, la sesión se cerró por inactividad 🔒'); return; }
  if (session) entrarConMFA(); else pantallaAcceso('entrar');
})();

if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
