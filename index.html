<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7490">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src https://sinxqgtdvoqjypgytrce.supabase.co wss://sinxqgtdvoqjypgytrce.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Consulta LV</title>
<script src="supabase.js"></script>
<style>
:root{--pri:#0e7490;--pri2:#6d28d9;--bg:#f3f6f9;--card:#fff;--txt:#0f172a;--sub:#64748b;--line:#e2e8f0;--ok:#059669;--bad:#dc2626}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:90px}
header{position:relative;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:calc(env(safe-area-inset-top) + 20px) 20px 24px;border-radius:0 0 26px 26px}
header small{opacity:.85;font-size:13px}
header h1{font-size:22px;margin-top:4px}
.hbtn{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 18px);background:rgba(255,255,255,.2);border:none;color:#fff;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer}
.wrap{padding:18px;max-width:720px;margin:0 auto}
h2{font-size:17px;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h3{font-size:15px;margin-bottom:8px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:13px}
.mini{color:var(--sub);font-size:12px;line-height:1.45;margin-top:8px}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:none;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.full{display:block;width:100%;padding:14px;font-size:15px;margin-top:10px}
.btn.ghost{background:#e0f2fe;color:var(--pri)}
.btn.red{background:#fee2e2;color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.5}
label{font-size:13px;color:var(--sub);display:block;margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--txt);font-family:inherit}
textarea{min-height:90px;resize:vertical}
.fila{display:flex;gap:10px}.fila>*{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;line-height:1.4}
.check input{width:22px;height:22px;flex-shrink:0;margin-top:1px}
.check a{color:var(--pri)}
.tabs{display:flex;background:#e2e8f0;border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:none;background:none;padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer}
.tabs button.on{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex-shrink:0;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;text-align:center;cursor:pointer;font-size:13px;min-width:64px}
.chip b{display:block;font-size:17px}
.chip.on{border-color:var(--pri);background:#e0f2fe;color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 4px;font-weight:700;cursor:pointer;font-size:15px}
.slot.on{border-color:var(--pri);background:var(--pri);color:#fff}
.serv{border:2px solid var(--line);cursor:pointer}
.serv.on{border-color:var(--pri);background:#f0f9ff}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.b-pend{background:#fef3c7;color:#92400e}.b-conf{background:#dbeafe;color:#1e40af}.b-ok{background:#d1fae5;color:#065f46}.b-bad{background:#fee2e2;color:#991b1b}.b-gris{background:#f1f5f9;color:#475569}
.acciones{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.foto{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.15);background:#e2e8f0}
.perfil{text-align:center;margin-top:-50px}
.perfil h1{font-size:22px;margin-top:8px}
.aviso{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;margin-bottom:12px}
.ok{background:#d1fae5;color:#065f46}.warn{background:#fef3c7;color:#92400e}.err{background:#fee2e2;color:#991b1b}.info{background:#e0f2fe;color:#075985}
.link-box{background:#f1f5f9;border-radius:12px;padding:12px;font-size:13px;word-break:break-all;margin:8px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);border-top:1px solid var(--line);z-index:5}
nav button{background:none;border:none;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;flex:1}
nav button i{font-style:normal;font-size:21px}
nav button.on{color:var(--pri);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-end;z-index:20}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:720px;margin:0 auto;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);max-height:90vh;overflow:auto}
.sheet p,.sheet li{font-size:14px;line-height:1.55;margin-bottom:8px}
.sheet ul{margin-left:18px}
#toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:50;display:none;max-width:90%;text-align:center}
#toast.err{background:var(--bad)}
.carga{text-align:center;padding:60px 20px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:26px 10px;background:#fff;border-radius:16px}
.pie{text-align:center;font-size:12px;color:var(--sub);margin-top:24px;line-height:1.6}
.pie a{color:var(--pri)}
.dia{font-weight:700;font-size:14px;margin:14px 0 6px}
.franja{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:14px}
</style>
</head>
<body>
<div id="app"><div class="carga">Cargando…</div></div>
<div id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target===this)cerrarModal()"><div class="sheet" id="modal-c"></div></div>

<script>
/* ===== CONFIGURACIÓN ===== */
const SB_URL = 'https://sinxqgtdvoqjypgytrce.supabase.co';
const SB_KEY = 'sb_publishable_zrc5qqxNfy9X_LUef2HU4Q_5WKGZZgD';
const TZ = 'America/Bogota';
const INACTIVIDAD_MIN = 15;
const VERSION = '1.0';

const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const app = document.getElementById('app');
const SLUG = (new URLSearchParams(location.search).get('p') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');

/* ===== UTILIDADES ===== */
const $ = id => document.getElementById(id);
function esc(t){ return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, err){ const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500); }
function abrirModal(html){ $('modal-c').innerHTML = html; $('modal').classList.add('on'); }
function cerrarModal(){ $('modal').classList.remove('on'); }
function peso(n){ return '$' + Number(n || 0).toLocaleString('es-CO'); }
function fecha(iso, o){ return new Date(iso).toLocaleString('es-CO', Object.assign({ timeZone: TZ }, o)); }
function hora(iso){ return fecha(iso, { hour: 'numeric', minute: '2-digit', hour12: true }); }
function hoyYMD(){ return new Date().toLocaleDateString('en-CA', { timeZone: TZ }); }
function sumarDias(ymd, n){ const d = new Date(ymd + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function soloDigitos(t){ return String(t || '').replace(/[^0-9]/g, ''); }
function waNum(t){ let d = soloDigitos(t); if (d.length === 10) d = '57' + d; return d; }
function fotoSegura(u){ return /^https:\/\/[^\s"'<>]+$/i.test(u || '') ? u : ''; }
function mensajeError(e){
  const m = (e && (e.message || e.error_description)) || 'Ocurrió un error';
  if (/Invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos';
  if (/Email not confirmed/i.test(m)) return 'Primero confirma tu correo (revisa tu bandeja y spam)';
  if (/already registered/i.test(m)) return 'Ese correo ya tiene cuenta. Ingresa o recupera tu contraseña';
  if (/rate limit/i.test(m)) return 'Demasiados intentos. Espera unos minutos';
  if (/duplicate key|23505/i.test(m)) return 'Ese enlace ya está en uso, elige otro';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión. Revisa tu internet';
  return m;
}
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const ORDEN_DIAS = [1,2,3,4,5,6,0];
const ESTADOS = { pendiente:['Pendiente','b-pend'], confirmada:['Confirmada','b-conf'], asistio:['Asistió','b-ok'], no_asistio:['No asistió','b-bad'], cancelada:['Cancelada','b-gris'] };

/* ===== TEXTOS LEGALES ===== */
function textoDatos(nombre){
  return `<h3>Autorización para el tratamiento de datos personales</h3>
  <p>De acuerdo con la Ley 1581 de 2012 y el Decreto 1377 de 2013, autorizo a <b>${esc(nombre)}</b> (responsable del tratamiento) para recolectar, almacenar y usar mis datos personales, incluidos <b>datos sensibles de salud</b>, con estas finalidades:</p>
  <ul><li>Agendar, confirmar y recordar mis citas.</li><li>Prestar el servicio de psicología y llevar mi historia clínica.</li><li>Contactarme por teléfono, WhatsApp o correo sobre mi atención.</li></ul>
  <p>Sé que responder preguntas sobre datos sensibles es <b>facultativo</b>. Tengo derecho a conocer, actualizar, rectificar y solicitar la supresión de mis datos, y a revocar esta autorización, salvo cuando exista un deber legal de conservarlos: la historia clínica se conserva mínimo 15 años (Resolución 839 de 2017).</p>
  <p>La plataforma tecnológica es provista por <b>LV Studio</b> como encargado del tratamiento. Los datos se almacenan cifrados en servidores ubicados en Estados Unidos, país reconocido por la SIC con nivel adecuado de protección.</p>
  <p>Puedo ejercer mis derechos desde el enlace "Mis derechos sobre mis datos" en esta página.</p>`;
}
function textoConsentimiento(nombre){
  return `<h3>Consentimiento informado para atención psicológica</h3>
  <p>Acepto de forma libre y voluntaria recibir atención psicológica por parte de <b>${esc(nombre)}</b>, conforme a la Ley 1090 de 2006 (Código Deontológico y Bioético del psicólogo).</p>
  <ul>
  <li>Entiendo que el proceso incluye entrevistas, evaluación y, cuando sea pertinente, la aplicación de pruebas y técnicas psicológicas.</li>
  <li>Lo que comparta es <b>confidencial</b> y está protegido por el secreto profesional. La reserva puede levantarse solo cuando exista riesgo grave para mi vida o la de otras personas, o por orden de autoridad competente.</li>
  <li>Puedo hacer preguntas, solicitar información sobre mi proceso y retirarme en cualquier momento.</li>
  <li>Si la atención es virtual, entiendo que depende de la conexión a internet y que debo estar en un lugar privado.</li>
  <li>En una situación de crisis o emergencia debo comunicarme con la Línea 106, el 123 o acudir al servicio de urgencias más cercano.</li>
  </ul>`;
}

/* =========================================================
   PÁGINA PÚBLICA DE RESERVAS  (?p=enlace)
   ========================================================= */
const R = { perfil: null, serv: null, fecha: null, hora: null, horas: [] };

async function paginaPublica(){
  const { data, error } = await sb.rpc('perfil_publico', { p_slug: SLUG });
  if (error || !data) {
    app.innerHTML = `<header><h1>Consulta LV</h1></header><div class="wrap"><div class="empty">Esta página de reservas no está disponible.<br>Verifica el enlace con tu profesional.</div></div>`;
    return;
  }
  R.perfil = data; R.fecha = hoyYMD();
  pintarPublica();
}

function pintarPublica(){
  const p = R.perfil, f = fotoSegura(p.foto);
  const servs = p.servicios || [];
  let h = `<header style="padding-bottom:64px"><small>Reserva tu cita en línea</small></header>
  <div class="wrap">
  <div class="perfil">${f ? `<img class="foto" src="${esc(f)}" alt="">` : `<div class="foto" style="display:inline-flex;align-items:center;justify-content:center;font-size:34px">🧠</div>`}
    <h1>${esc(p.nombre)}</h1>
    <div class="sub">${esc(p.titulo)}${p.tarjeta ? ' · T.P. ' + esc(p.tarjeta) : ''}${p.ciudad ? ' · ' + esc(p.ciudad) : ''}</div>
    ${p.bio ? `<p class="mini" style="font-size:14px;max-width:520px;margin:10px auto 0">${esc(p.bio)}</p>` : ''}
  </div>
  <h2>1. Elige el servicio</h2>`;
  if (!servs.length) h += `<div class="empty">Este profesional aún no tiene servicios disponibles.</div>`;
  servs.forEach(s => {
    h += `<div class="card serv ${R.serv && R.serv.id === s.id ? 'on' : ''}" onclick="elegirServicio('${esc(s.id)}')">
      <div class="row"><div class="grow"><b>${esc(s.nombre)}</b><div class="sub">${esc(s.duracion)} min · ${s.modalidad === 'virtual' ? '💻 Virtual' : s.modalidad === 'presencial' ? '🏢 Presencial' : '💻 Virtual o 🏢 presencial'}</div></div>
      <b style="color:var(--pri)">${s.precio ? peso(s.precio) : 'Consultar'}</b></div></div>`;
  });
  if (R.serv) {
    h += `<h2>2. Elige el día</h2><div class="chips">`;
    for (let i = 0; i < 21; i++) {
      const d = sumarDias(hoyYMD(), i), dt = new Date(d + 'T12:00:00Z');
      h += `<div class="chip ${d === R.fecha ? 'on' : ''}" onclick="elegirFecha('${d}')">${DIAS[dt.getUTCDay()].slice(0,3)}<b>${dt.getUTCDate()}</b>${dt.toLocaleDateString('es-CO',{month:'short',timeZone:'UTC'})}</div>`;
    }
    h += `</div><h2>3. Elige la hora</h2><div id="horas"><div class="carga" style="padding:20px">Buscando horarios…</div></div><div id="form-reserva"></div>`;
  }
  h += `<div class="pie">
    <a href="#" onclick="verLegal('datos');return false">Política de tratamiento de datos</a> ·
    <a href="#" onclick="formHabeas();return false">Mis derechos sobre mis datos</a><br>
    Plataforma segura de LV Studio · Consulta LV</div></div>`;
  app.innerHTML = h;
  if (R.serv) cargarHoras();
}

function elegirServicio(id){ R.serv = R.perfil.servicios.find(s => s.id === id); R.hora = null; pintarPublica(); }
function elegirFecha(d){ R.fecha = d; R.hora = null; pintarPublica(); }

async function cargarHoras(){
  const { data, error } = await sb.rpc('horarios_libres', { p_slug: SLUG, p_servicio: R.serv.id, p_fecha: R.fecha });
  const box = $('horas'); if (!box) return;
  if (error) { box.innerHTML = `<div class="aviso err">${esc(mensajeError(error))}</div>`; return; }
  R.horas = (data || []).map(x => x.hora);
  if (!R.horas.length) { box.innerHTML = `<div class="empty">No hay horarios libres este día. Prueba otro día.</div>`; return; }
  box.innerHTML = `<div class="grid">${R.horas.map((t, i) => `<button class="slot ${R.hora === t ? 'on' : ''}" onclick="elegirHora(${i})">${esc(hora(t))}</button>`).join('')}</div>`;
  if (R.hora) pintarFormReserva();
}
function elegirHora(i){ R.hora = R.horas[i]; cargarHoras(); }

function pintarFormReserva(){
  const n = R.perfil.nombre;
  $('form-reserva').innerHTML = `<h2>4. Tus datos</h2>
  <div class="card">
    <div class="aviso info">📅 ${esc(fecha(R.hora, { weekday:'long', day:'numeric', month:'long' }))} · ${esc(hora(R.hora))}<br>${esc(R.serv.nombre)}${R.serv.precio ? ' · ' + peso(R.serv.precio) : ''}</div>
    <label>Nombre completo</label><input id="r-nombre" maxlength="120" autocomplete="name">
    <div class="fila"><div><label>Documento</label><input id="r-doc" maxlength="20" inputmode="numeric"></div>
    <div><label>Celular (WhatsApp)</label><input id="r-tel" maxlength="15" inputmode="tel" autocomplete="tel"></div></div>
    <label>Correo (opcional)</label><input id="r-email" type="email" maxlength="120" autocomplete="email">
    <label class="check"><input type="checkbox" id="r-datos"><span>Autorizo el tratamiento de mis datos personales y sensibles. <a href="#" onclick="verLegal('datos');return false">Leer autorización</a></span></label>
    <label class="check"><input type="checkbox" id="r-cons"><span>Acepto el consentimiento informado para atención psicológica. <a href="#" onclick="verLegal('cons');return false">Leer consentimiento</a></span></label>
    <button class="btn full" id="r-btn" onclick="confirmarReserva()">Confirmar reserva</button>
    <p class="mini">Tus datos viajan cifrados y solo los ve ${esc(n)}.</p>
  </div>`;
}

function verLegal(t){
  const n = R.perfil ? R.perfil.nombre : 'el profesional';
  abrirModal((t === 'datos' ? textoDatos(n) : textoConsentimiento(n)) + `<button class="btn full" onclick="cerrarModal()">Entendido</button>`);
}

async function confirmarReserva(){
  const v = id => $(id).value.trim();
  if (!$('r-datos').checked || !$('r-cons').checked) { toast('Debes aceptar la autorización de datos y el consentimiento', true); return; }
  if (v('r-nombre').length < 3 || soloDigitos(v('r-doc')).length < 4 || soloDigitos(v('r-tel')).length < 7) { toast('Completa nombre, documento y celular', true); return; }
  const b = $('r-btn'); b.disabled = true; b.textContent = 'Reservando…';
  const { data, error } = await sb.rpc('reservar', {
    p_slug: SLUG, p_servicio: R.serv.id, p_inicio: R.hora,
    p_nombres: v('r-nombre'), p_documento: v('r-doc'), p_telefono: v('r-tel'), p_email: v('r-email'),
    p_acepta_datos: true, p_acepta_consentimiento: true });
  if (error || !data || !data.ok) {
    b.disabled = false; b.textContent = 'Confirmar reserva';
    toast(mensajeError(error), true);
    if (/disponible/i.test((error && error.message) || '')) { R.hora = null; cargarHoras(); $('form-reserva').innerHTML = ''; }
    return;
  }
  const p = R.perfil, cuando = fecha(R.hora, { weekday:'long', day:'numeric', month:'long' }) + ' a las ' + hora(R.hora);
  const msg = `Hola ${p.nombre}, acabo de reservar una cita de ${R.serv.nombre} para el ${cuando}. Mi nombre es ${v('r-nombre')}.`;
  app.innerHTML = `<header><h1>¡Cita reservada! ✅</h1></header><div class="wrap">
    <div class="card"><div class="aviso ok"><b>${esc(R.serv.nombre)}</b><br>📅 ${esc(cuando)}<br>👤 con ${esc(p.nombre)}</div>
    <p style="font-size:14px;line-height:1.5">Tu cita quedó <b>pendiente de confirmación</b>. ${esc(p.nombre)} te contactará para confirmarla${R.serv.precio ? ' y coordinar el pago' : ''}.</p>
    ${p.whatsapp ? `<a class="btn full" href="https://wa.me/${waNum(p.whatsapp)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">💬 Avisar por WhatsApp</a>` : ''}
    <p class="mini">Si se te presenta una emergencia emocional, comunícate con la Línea 106 o el 123.</p></div></div>`;
}

function formHabeas(){
  abrirModal(`<h3>Mis derechos sobre mis datos (habeas data)</h3>
  <p class="mini">Solicitud dirigida a ${esc(R.perfil ? R.perfil.nombre : 'el profesional')}. Tiene hasta 10 días hábiles para responder consultas y 15 días hábiles para reclamos (Ley 1581 de 2012).</p>
  <label>Tipo de solicitud</label><select id="h-tipo">
    <option value="consulta">Consultar qué datos tienen</option><option value="actualizacion">Actualizar mis datos</option>
    <option value="rectificacion">Corregir mis datos</option><option value="supresion">Eliminar mis datos / revocar autorización</option>
    <option value="copia_historia">Copia de mi historia clínica</option></select>
  <label>Nombre completo</label><input id="h-nombre" maxlength="120">
  <div class="fila"><div><label>Documento</label><input id="h-doc" maxlength="20"></div><div><label>Correo</label><input id="h-email" type="email" maxlength="120"></div></div>
  <label>Detalle (opcional)</label><textarea id="h-msg" maxlength="1000"></textarea>
  <button class="btn full" id="h-btn" onclick="enviarHabeas()">Enviar solicitud</button>
  <button class="btn full ghost" onclick="cerrarModal()">Cancelar</button>`);
}
async function enviarHabeas(){
  const b = $('h-btn'); b.disabled = true;
  const { error } = await sb.rpc('solicitud_habeas', { p_slug: SLUG, p_nombres: $('h-nombre').value, p_documento: $('h-doc').value,
    p_email: $('h-email').value, p_tipo: $('h-tipo').value, p_mensaje: $('h-msg').value });
  b.disabled = false;
  if (error) { toast(mensajeError(error), true); return; }
  cerrarModal(); toast('Solicitud enviada ✅ Recibirás respuesta en tu correo');
}

/* =========================================================
   APP DEL PSICÓLOGO
   ========================================================= */
const S = { prof: null, vista: 'agenda', servicios: [], disp: [], citas: [] };

function pantallaAcceso(modo){
  modo = modo || 'entrar';
  app.innerHTML = `<header><small>LV Studio</small><h1>Consulta LV</h1></header><div class="wrap">
  <div class="card">
    <div class="tabs"><button class="${modo==='entrar'?'on':''}" onclick="pantallaAcceso('entrar')">Ingresar</button><button class="${modo==='crear'?'on':''}" onclick="pantallaAcceso('crear')">Crear cuenta</button></div>
    <label>Correo</label><input id="a-email" type="email" autocomplete="email" maxlength="120">
    <label>Contraseña ${modo==='crear' ? '(mínimo 10 caracteres)' : ''}</label><input id="a-pass" type="password" autocomplete="${modo==='crear'?'new-password':'current-password'}" maxlength="72">
    ${modo==='crear' ? `<label class="check"><input type="checkbox" id="a-terminos"><span>Acepto los términos de uso y declaro que soy profesional de la psicología con tarjeta profesional vigente.</span></label>` : ''}
    <button class="btn full" id="a-btn" onclick="${modo==='crear'?'crearCuenta()':'ingresar()'}">${modo==='crear'?'Crear cuenta · 14 días gratis':'Ingresar'}</button>
    ${modo==='entrar' ? `<button class="btn full ghost" onclick="recuperar()">Olvidé mi contraseña</button>` : ''}
  </div>
  <div class="pie">🔒 Conexión cifrada · Cada profesional ve solo a sus pacientes<br>Consulta LV v${VERSION} · LV Studio</div></div>`;
}

async function ingresar(){
  const b = $('a-btn'); b.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('a-email').value.trim(), password: $('a-pass').value });
  b.disabled = false;
  if (error) { toast(mensajeError(error), true); return; }
  abrirPanel();
}
async function crearCuenta(){
  const email = $('a-email').value.trim(), pass = $('a-pass').value;
  if (!$('a-terminos').checked) { toast('Debes aceptar los términos', true); return; }
  if (pass.length < 10 || !/[0-9]/.test(pass) || !/[a-zA-Z]/.test(pass)) { toast('La contraseña debe tener mínimo 10 caracteres, con letras y números', true); return; }
  const b = $('a-btn'); b.disabled = true;
  const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: location.origin + location.pathname } });
  b.disabled = false;
  if (error) { toast(mensajeError(error), true); return; }
  if (data.session) { abrirPanel(); return; }
  app.querySelector('.card').innerHTML = `<div class="aviso ok">📩 Te enviamos un correo a <b>${esc(email)}</b>.<br>Ábrelo y toca el enlace para confirmar tu cuenta. Revisa también la carpeta de spam.</div><button class="btn full" onclick="pantallaAcceso('entrar')">Ya confirmé, ingresar</button>`;
}
async function recuperar(){
  const email = $('a-email').value.trim();
  if (!email) { toast('Escribe tu correo primero', true); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error) { toast(mensajeError(error), true); return; }
  toast('Te enviamos un correo para crear una nueva contraseña');
}
function pantallaNuevaClave(){
  app.innerHTML = `<header><h1>Nueva contraseña</h1></header><div class="wrap"><div class="card">
  <label>Nueva contraseña (mínimo 10 caracteres)</label><input id="n-pass" type="password" autocomplete="new-password" maxlength="72">
  <button class="btn full" onclick="guardarNuevaClave()">Guardar</button></div></div>`;
}
async function guardarNuevaClave(){
  const p = $('n-pass').value;
  if (p.length < 10 || !/[0-9]/.test(p) || !/[a-zA-Z]/.test(p)) { toast('Mínimo 10 caracteres, con letras y números', true); return; }
  const { error } = await sb.auth.updateUser({ password: p });
  if (error) { toast(mensajeError(error), true); return; }
  toast('Contraseña actualizada ✅'); abrirPanel();
}
async function salir(msg){ await sb.auth.signOut(); S.prof = null; pantallaAcceso('entrar'); if (msg) toast(msg); }

/* --- cierre por inactividad --- */
let tInact;
function reiniciarInactividad(){ clearTimeout(tInact); if (S.prof) tInact = setTimeout(() => salir('Sesión cerrada por inactividad 🔒'), INACTIVIDAD_MIN * 60000); }
['click','keydown','touchstart','scroll'].forEach(e => document.addEventListener(e, reiniciarInactividad, { passive: true }));

async function abrirPanel(){
  app.innerHTML = `<div class="carga">Cargando tu consultorio…</div>`;
  const { data, error } = await sb.from('profesionales').select('*').single();
  if (error || !data) { toast(mensajeError(error), true); pantallaAcceso('entrar'); return; }
  S.prof = data; reiniciarInactividad();
  if (!data.nombre || !data.slug) S.vista = 'perfil';
  pintarPanel();
}

function diasRestantes(){ const d = Math.round((new Date(S.prof.activo_hasta + 'T23:59:59') - new Date()) / 86400000); return d; }
function enlaceReservas(){ return location.origin + location.pathname + '?p=' + S.prof.slug; }

function pintarPanel(){
  const p = S.prof;
  app.innerHTML = `<header><small>${p.nombre ? 'Hola, ' + esc(p.nombre.split(' ')[0]) + ' 👋' : 'Bienvenido(a) 👋'}</small><h1>Consulta LV</h1>
    <button class="hbtn" onclick="salir()">Salir</button></header>
  <div class="wrap" id="vista"></div>
  <nav>
    <button data-v="agenda"><i>📅</i>Agenda</button>
    <button data-v="servicios"><i>💼</i>Servicios</button>
    <button data-v="horarios"><i>🕘</i>Horarios</button>
    <button data-v="perfil"><i>👤</i>Perfil</button>
  </nav>`;
  document.querySelectorAll('nav button').forEach(b => { b.onclick = () => irA(b.dataset.v); b.classList.toggle('on', b.dataset.v === S.vista); });
  irA(S.vista);
}
function irA(v){
  S.vista = v;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  ({ agenda: vistaAgenda, servicios: vistaServicios, horarios: vistaHorarios, perfil: vistaPerfil })[v]();
  window.scrollTo(0, 0);
}

/* --- AGENDA --- */
async function vistaAgenda(){
  const p = S.prof, v = $('vista'), dr = diasRestantes();
  let top = '';
  if (dr < 0) top += `<div class="aviso err">Tu suscripción venció. Tu página de reservas está oculta. Tus datos siguen guardados y seguros. Escribe a LV Studio para renovar.</div>`;
  else if (dr <= 5) top += `<div class="aviso warn">Te quedan <b>${dr} día(s)</b> de suscripción.</div>`;
  if (!p.slug || !p.nombre) top += `<div class="aviso warn">Completa tu <b>Perfil</b> para activar tu página de reservas.</div>`;
  else top += `<div class="card"><h3>🔗 Tu página de reservas</h3><div class="link-box">${esc(enlaceReservas())}</div>
    <div class="acciones"><button class="btn sm" onclick="copiar(enlaceReservas())">Copiar</button>
    <a class="btn sm ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Agenda tu cita conmigo aquí: ' + enlaceReservas())}">Compartir por WhatsApp</a>
    <a class="btn sm ghost" target="_blank" rel="noopener" href="${esc(enlaceReservas())}">Ver</a></div></div>`;
  v.innerHTML = top + `<h2>Próximas citas</h2><div id="lista-citas"><div class="carga" style="padding:20px">Cargando…</div></div>`;
  const desde = new Date(Date.now() - 12 * 3600000).toISOString();
  const { data, error } = await sb.from('citas')
    .select('id,inicio,fin,estado,origen,valor,pagado,pacientes(nombres,telefono),servicios(nombre)')
    .gte('inicio', desde).order('inicio', { ascending: true }).limit(100);
  const box = $('lista-citas'); if (!box) return;
  if (error) { box.innerHTML = `<div class="aviso err">${esc(mensajeError(error))}</div>`; return; }
  S.citas = data || [];
  if (!S.citas.length) { box.innerHTML = `<div class="empty">No tienes citas próximas.<br>Comparte tu página de reservas para recibir pacientes.</div>`; return; }
  let h = '', diaAnt = '';
  S.citas.forEach(c => {
    const dia = fecha(c.inicio, { weekday:'long', day:'numeric', month:'long' });
    if (dia !== diaAnt) { h += `<div class="dia">${esc(dia.charAt(0).toUpperCase() + dia.slice(1))}</div>`; diaAnt = dia; }
    const e = ESTADOS[c.estado] || ['', 'b-gris'], pa = c.pacientes || {};
    h += `<div class="card"><div class="row"><div style="font-weight:800;color:var(--pri);min-width:70px">${esc(hora(c.inicio))}</div>
      <div class="grow"><b>${esc(pa.nombres || 'Paciente')}</b><div class="sub">${esc((c.servicios && c.servicios.nombre) || 'Cita')}${c.valor ? ' · ' + peso(c.valor) : ''}${c.origen === 'online' ? ' · 🌐 en línea' : ''}</div></div>
      <span class="badge ${e[1]}">${e[0]}</span></div>
      <div class="acciones">
      ${c.estado === 'pendiente' ? `<button class="btn sm" onclick="estadoCita('${c.id}','confirmada')">Confirmar</button>` : ''}
      ${pa.telefono ? `<a class="btn sm ghost" target="_blank" rel="noopener" href="${esc(enlaceRecordatorio(c))}">💬 Recordar</a>` : ''}
      ${['pendiente','confirmada'].includes(c.estado) ? `<button class="btn sm ghost" onclick="estadoCita('${c.id}','asistio')">Asistió</button><button class="btn sm ghost" onclick="estadoCita('${c.id}','no_asistio')">No asistió</button><button class="btn sm red" onclick="estadoCita('${c.id}','cancelada')">Cancelar</button>` : ''}
      <button class="btn sm ${c.pagado ? '' : 'ghost'}" onclick="pagoCita('${c.id}',${!c.pagado})">${c.pagado ? '✓ Pagada' : 'Marcar pagada'}</button>
      </div></div>`;
  });
  box.innerHTML = h;
}
function enlaceRecordatorio(c){
  const pa = c.pacientes || {}, p = S.prof;
  const t = `Hola ${pa.nombres ? pa.nombres.split(' ')[0] : ''}, te recuerdo tu cita de ${(c.servicios && c.servicios.nombre) || 'psicología'} el ${fecha(c.inicio,{weekday:'long',day:'numeric',month:'long'})} a las ${hora(c.inicio)}. ¿Me confirmas tu asistencia? ${p.nequi ? 'Puedes pagar por Nequi al ' + p.nequi + '. ' : ''}— ${p.nombre}`;
  return 'https://wa.me/' + waNum(pa.telefono) + '?text=' + encodeURIComponent(t);
}
async function estadoCita(id, estado){
  if (estado === 'cancelada' && !confirm('¿Cancelar esta cita? El horario quedará libre.')) return;
  const { error } = await sb.from('citas').update({ estado }).eq('id', id);
  if (error) { toast(mensajeError(error), true); return; }
  toast('Cita actualizada'); vistaAgenda();
}
async function pagoCita(id, pagado){
  const { error } = await sb.from('citas').update({ pagado }).eq('id', id);
  if (error) { toast(mensajeError(error), true); return; }
  vistaAgenda();
}
function copiar(t){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Copiado ✅')).catch(() => prompt('Copia el enlace:', t)); }

/* --- SERVICIOS --- */
async function vistaServicios(){
  const v = $('vista');
  v.innerHTML = `<h2>Tus servicios <button class="btn sm" onclick="formServicio()">+ Nuevo</button></h2><div id="lista-serv"><div class="carga" style="padding:20px">Cargando…</div></div>`;
  const { data, error } = await sb.from('servicios').select('*').order('created_at');
  if (error) { $('lista-serv').innerHTML = `<div class="aviso err">${esc(mensajeError(error))}</div>`; return; }
  S.servicios = data || [];
  $('lista-serv').innerHTML = S.servicios.length ? S.servicios.map(s => `<div class="card"><div class="row"><div class="grow"><b>${esc(s.nombre)}</b>
    <div class="sub">${s.duracion_min} min · ${s.modalidad} · ${peso(s.precio)}</div></div>
    <span class="badge ${s.activo ? 'b-ok' : 'b-gris'}">${s.activo ? 'Visible' : 'Oculto'}</span></div>
    <div class="acciones"><button class="btn sm ghost" onclick="formServicio('${s.id}')">Editar</button>
    <button class="btn sm ghost" onclick="toggleServicio('${s.id}',${!s.activo})">${s.activo ? 'Ocultar' : 'Mostrar'}</button></div></div>`).join('')
    : `<div class="empty">Crea tu primer servicio. Ej: "Psicoterapia individual", 50 min.</div>`;
}
function formServicio(id){
  const s = S.servicios.find(x => x.id === id) || { nombre:'', duracion_min:50, precio:0, modalidad:'virtual' };
  abrirModal(`<h3>${id ? 'Editar' : 'Nuevo'} servicio</h3>
  <label>Nombre</label><input id="s-nombre" maxlength="80" value="${esc(s.nombre)}" placeholder="Ej: Psicoterapia individual">
  <div class="fila"><div><label>Duración (min)</label><input id="s-dur" type="number" min="15" max="240" value="${s.duracion_min}"></div>
  <div><label>Precio ($)</label><input id="s-precio" type="number" min="0" step="1000" value="${s.precio}"></div></div>
  <label>Modalidad</label><select id="s-mod"><option value="virtual">Virtual</option><option value="presencial">Presencial</option><option value="ambas">Virtual o presencial</option></select>
  <button class="btn full" onclick="guardarServicio(${id ? `'${id}'` : 'null'})">Guardar</button>
  <button class="btn full ghost" onclick="cerrarModal()">Cancelar</button>`);
  $('s-mod').value = s.modalidad;
}
async function guardarServicio(id){
  const d = { nombre: $('s-nombre').value.trim(), duracion_min: parseInt($('s-dur').value, 10), precio: parseInt($('s-precio').value, 10) || 0, modalidad: $('s-mod').value };
  if (d.nombre.length < 2) { toast('Escribe el nombre del servicio', true); return; }
  if (!(d.duracion_min >= 15 && d.duracion_min <= 240)) { toast('La duración debe estar entre 15 y 240 minutos', true); return; }
  const q = id ? sb.from('servicios').update(d).eq('id', id) : sb.from('servicios').insert(d);
  const { error } = await q;
  if (error) { toast(mensajeError(error), true); return; }
  cerrarModal(); toast('Servicio guardado ✅'); vistaServicios();
}
async function toggleServicio(id, activo){
  const { error } = await sb.from('servicios').update({ activo }).eq('id', id);
  if (error) { toast(mensajeError(error), true); return; }
  vistaServicios();
}

/* --- HORARIOS --- */
async function vistaHorarios(){
  const v = $('vista');
  v.innerHTML = `<h2>Horario de atención <button class="btn sm" onclick="formFranja()">+ Agregar</button></h2>
  <p class="mini" style="margin-top:-4px;margin-bottom:10px">Tus pacientes solo podrán reservar dentro de estas franjas. Las citas ya agendadas se descuentan solas.</p><div id="lista-disp"><div class="carga" style="padding:20px">Cargando…</div></div>`;
  const { data, error } = await sb.from('disponibilidad').select('*').order('hora_inicio');
  if (error) { $('lista-disp').innerHTML = `<div class="aviso err">${esc(mensajeError(error))}</div>`; return; }
  S.disp = data || [];
  if (!S.disp.length) { $('lista-disp').innerHTML = `<div class="empty">Agrega tus franjas de atención. Ej: lunes de 8:00 a. m. a 12:00 m.</div>`; return; }
  $('lista-disp').innerHTML = `<div class="card">` + ORDEN_DIAS.map(d => {
    const fr = S.disp.filter(x => x.dia === d); if (!fr.length) return '';
    return `<div class="dia">${DIAS[d]}</div>` + fr.map(x => `<div class="franja"><span>${x.hora_inicio.slice(0,5)} – ${x.hora_fin.slice(0,5)}</span><button class="btn sm red" onclick="borrarFranja('${x.id}')">Quitar</button></div>`).join('');
  }).join('') + `</div>`;
}
function formFranja(){
  abrirModal(`<h3>Nueva franja de atención</h3>
  <label>Días</label><div class="chips" id="f-dias">${ORDEN_DIAS.map(d => `<div class="chip" data-d="${d}" onclick="this.classList.toggle('on')">${DIAS[d].slice(0,3)}</div>`).join('')}</div>
  <div class="fila"><div><label>Desde</label><input id="f-ini" type="time" value="08:00"></div><div><label>Hasta</label><input id="f-fin" type="time" value="12:00"></div></div>
  <button class="btn full" onclick="guardarFranja()">Guardar</button><button class="btn full ghost" onclick="cerrarModal()">Cancelar</button>`);
}
async function guardarFranja(){
  const dias = [...document.querySelectorAll('#f-dias .chip.on')].map(c => parseInt(c.dataset.d, 10));
  const ini = $('f-ini').value, fin = $('f-fin').value;
  if (!dias.length) { toast('Elige al menos un día', true); return; }
  if (!ini || !fin || fin <= ini) { toast('La hora final debe ser después de la inicial', true); return; }
  const { error } = await sb.from('disponibilidad').insert(dias.map(d => ({ dia: d, hora_inicio: ini, hora_fin: fin })));
  if (error) { toast(mensajeError(error), true); return; }
  cerrarModal(); toast('Horario guardado ✅'); vistaHorarios();
}
async function borrarFranja(id){
  const { error } = await sb.from('disponibilidad').delete().eq('id', id);
  if (error) { toast(mensajeError(error), true); return; }
  vistaHorarios();
}

/* --- PERFIL --- */
function vistaPerfil(){
  const p = S.prof, v = $('vista');
  v.innerHTML = `<h2>Tu perfil profesional</h2><div class="card">
  <label>Nombre completo</label><input id="p-nombre" maxlength="120" value="${esc(p.nombre)}">
  <div class="fila"><div><label>Título</label><input id="p-titulo" maxlength="80" value="${esc(p.titulo)}"></div>
  <div><label>Tarjeta profesional</label><input id="p-tp" maxlength="30" value="${esc(p.tarjeta_profesional)}"></div></div>
  <div class="fila"><div><label>Ciudad</label><input id="p-ciudad" maxlength="60" value="${esc(p.ciudad)}"></div>
  <div><label>WhatsApp</label><input id="p-wa" maxlength="15" inputmode="tel" value="${esc(p.whatsapp)}"></div></div>
  <label>Sobre ti (lo verán tus pacientes)</label><textarea id="p-bio" maxlength="600">${esc(p.bio)}</textarea>
  <label>Dirección del consultorio (si atiendes presencial)</label><input id="p-dir" maxlength="150" value="${esc(p.direccion)}">
  <label>Número Nequi para pagos (opcional)</label><input id="p-nequi" maxlength="15" inputmode="tel" value="${esc(p.nequi)}">
  <label>Foto (enlace https, opcional)</label><input id="p-foto" maxlength="400" value="${esc(p.foto_url)}" placeholder="https://...">
  <label>Tu enlace de reservas</label><input id="p-slug" maxlength="40" value="${esc(p.slug || '')}" placeholder="ej: ana-gomez-psicologa" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'-')">
  <p class="mini">Quedará así: ${esc(location.origin + location.pathname)}?p=<b id="p-prev">${esc(p.slug || 'tu-nombre')}</b></p>
  <button class="btn full" id="p-btn" onclick="guardarPerfil()">Guardar perfil</button></div>
  <div class="card"><h3>🔒 Seguridad</h3><p class="mini" style="margin-top:0">Correo: ${esc(p.email)}<br>Suscripción activa hasta: <b>${esc(p.activo_hasta)}</b><br>La sesión se cierra sola tras ${INACTIVIDAD_MIN} minutos sin uso.</p>
  <button class="btn full ghost" onclick="cambiarClave()">Cambiar contraseña</button></div>`;
  $('p-slug').addEventListener('input', e => $('p-prev').textContent = e.target.value || 'tu-nombre');
}
async function guardarPerfil(){
  const d = { nombre: $('p-nombre').value.trim(), titulo: $('p-titulo').value.trim(), tarjeta_profesional: $('p-tp').value.trim(),
    ciudad: $('p-ciudad').value.trim(), whatsapp: soloDigitos($('p-wa').value), bio: $('p-bio').value.trim(),
    direccion: $('p-dir').value.trim(), nequi: soloDigitos($('p-nequi').value), foto_url: $('p-foto').value.trim(),
    slug: $('p-slug').value.trim().replace(/^-+|-+$/g, '') };
  if (d.nombre.length < 3) { toast('Escribe tu nombre completo', true); return; }
  if (!/^[a-z0-9-]{3,40}$/.test(d.slug)) { toast('El enlace debe tener entre 3 y 40 letras, números o guiones', true); return; }
  if (d.foto_url && !fotoSegura(d.foto_url)) { toast('La foto debe ser un enlace que empiece por https://', true); return; }
  const b = $('p-btn'); b.disabled = true;
  const { data, error } = await sb.from('profesionales').update(d).eq('id', S.prof.id).select().single();
  b.disabled = false;
  if (error) { toast(mensajeError(error), true); return; }
  S.prof = data; toast('Perfil guardado ✅'); pintarPanel();
}
function cambiarClave(){ pantallaNuevaClave(); }

/* ===== INICIO ===== */
(async function iniciar(){
  if (SLUG) { paginaPublica(); return; }
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') pantallaNuevaClave(); });
  if (/type=recovery/.test(location.hash)) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session) abrirPanel(); else pantallaAcceso('entrar');
})();
</script>
